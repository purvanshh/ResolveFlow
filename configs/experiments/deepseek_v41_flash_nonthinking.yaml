extends: configs/default.yaml

experiment:
  id: deepseek_v41_flash_nonthinking
  name: deepseek-v41-flash-nonthinking
  seed: 42

agent:
  provider: deepseek
  classifier_model: deepseek-flash
  responder_model: deepseek-flash
  model_version: DeepSeek-V4.1-Flash
  base_url: https://api.deepseek.com
  thinking_enabled: false
  classifier_mode: llm
  responder_mode: llm
  top_k: 3
  similarity_threshold: 0.45
  retrieval_mode: auto
  skip_generation_on_high_risk: true

judge:
  provider: openai
  model: gpt-4o-mini

artifacts:
  final_dir: artifacts/final/deepseek_v41_flash_nonthinking
  predictions_path: artifacts/evaluation/deepseek_v41_flash_nonthinking/agent_predictions.jsonl
  safety_path: artifacts/final/deepseek_v41_flash_nonthinking/safety_suite.json
