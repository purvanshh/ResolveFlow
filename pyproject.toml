[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveflow"
version = "0.1.0"
description = "Customer support intent resolution pipeline on Twitter data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "pyarrow",
    "scikit-learn",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
discovery = [
    "sentence-transformers",
]
labeling = [
    "streamlit",
]
llm = [
    "openai",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
